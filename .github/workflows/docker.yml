name: Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name, which ghcr.io requires.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/nativesem
            ghcr.io/${{ github.repository_owner }}/r-c-typing
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Notify the r-typing repo so it reruns the analysis pipeline.
      # Requires a PAT (PIPELINE_DISPATCH_TOKEN) with `workflow` scope on
      # the r-typing repository, stored as a secret here in nativesem.
      - name: Trigger r-typing pipeline
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
          repository: PRL-PRG/r-typing
          event-type: r-c-typing-updated
